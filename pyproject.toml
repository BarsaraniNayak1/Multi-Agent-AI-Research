[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-copilot"
version = "0.1.0"
description = "Local multi-agent research copilot for academic and market research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "chromadb>=0.5.0",
  "scrapy>=2.11.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "pydantic>=2.7.0",
  "groq>=0.11.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
research-copilot = "research_copilot.cli:main"
research-copilot-ui = "research_copilot.web:main"

[tool.setuptools]
packages = ["research_copilot"]

[tool.setuptools.package-data]
research_copilot = ["index.html"]
